# Multi-instance deployment: 2 app replicas behind nginx, sharing MongoDB, Redis
# (Socket.IO adapter + presence + rate limits) and MinIO (S3-compatible media storage).
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
#   open http://localhost:8080
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pqchat
      MINIO_ROOT_PASSWORD: pqchat-minio-secret
      # Browsers upload/download ciphertext directly with presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 pqchat pqchat-minio-secret; do sleep 1; done &&
             mc mb -p local/pqchat-media"

  app:
    build: .
    deploy:
      replicas: 2
    depends_on: [mongo, redis, minio-init]
    environment:
      MONGO_URI: mongodb://mongo:27017/pqchat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      ALLOWED_ORIGINS: http://localhost:8080
      TRUST_PROXY: "1"
      S3_BUCKET: pqchat-media
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: pqchat
      AWS_SECRET_ACCESS_KEY: pqchat-minio-secret

  nginx:
    image: nginx:alpine
    depends_on: [app]
    ports: ["8080:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]

volumes:
  mongo-data:
  minio-data:
