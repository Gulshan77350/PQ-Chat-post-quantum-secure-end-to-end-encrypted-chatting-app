# Round-robin across app replicas. No sticky sessions needed: clients use the WebSocket
# transport only, and all shared state (sessions, presence, rate limits) is in Mongo/Redis.
resolver 127.0.0.11 valid=10s;

upstream pqchat {
  server app:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  client_max_body_size 1m; # media goes straight to object storage

  location / {
    proxy_pass http://pqchat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Appends the real client IP; the app trusts exactly one hop (TRUST_PROXY=1).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
